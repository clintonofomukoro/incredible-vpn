<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOUNDER - INCREDIBLE VPN</title>
<style>
body{background:#0b0b2e;color:white;font-family:Arial;padding:20px;text-align:center}
.card{background:#1a1a4a;padding:20px;border-radius:20px;max-width:500px;margin:20px auto}
input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#7c3aed;color:white;font-size:17px;margin-top:10px}
button.red{background:#ef4444}
button.green{background:#22c55e}
.hidden{display:none}
table{width:100%;background:white;color:black;border-radius:10px;font-size:14px}
td,th{padding:8px;border-bottom:1px solid #ddd;word-break:break-all}
</style>
</head>
<body>
<img src="logo.png" style="width:100px;height:100px;border-radius:50%">
<h1>FOUNDER DASHBOARD</h1>
<p>Only Clinton - INCREDIBLE VPN Founder</p>

<div id="login" class="card">
<h2>Founder Login</h2>
<input type="password" id="pin" placeholder="Enter Founder Password">
<button onclick="login()">Enter Dashboard</button>
<p style="font-size:12px">Default Password: Clinton123</p>
</div>

<div id="dash" class="card hidden">
<h2>Welcome Founder 👋</h2>
<p>Total Joined: <b id="total">0</b></p>
<p>Total Paid: <b id="paid">0</b></p>
<p>Total Money in Wallet: <b>₦<span id="money">0</span></b></p>

<h3>Servers Wey Dey Live</h3>
<table>
<tr><th>Name</th><th>Country</th><th>Config</th></tr>
<tbody id="serverList"><tr><td colspan="3">Loading servers...</td></tr></tbody>
</table>

<h3 style="margin-top:20px">People Wey Join</h3>
<table>
<tr><th>Email</th><th>Country</th><th>Action</th></tr>
<tbody id="list"></tbody>
</table>

<button class="green" onclick="alert('To withdraw: Open your Opay app - Check balance - Transfer to your bank.')">Withdraw Money to Opay / Bank</button>
<button onclick="alert('Users pay via Opay Transfer to Founder. You confirm for them inside WhatsApp, then you click Paid here.')">How To Accept Payment</button>
<button class="red" onclick="document.getElementById('dash').classList.add('hidden');document.getElementById('login').classList.remove('hidden')">Log Out</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAIYj_atzKHGiooyHkGCP3W6NIJ9GL7EMg",
  authDomain: "incredible-vpn.firebaseapp.com",
  projectId: "incredible-vpn",
  storageBucket: "incredible-vpn.firebasestorage.app",
  messagingSenderId: "700305194097",
  appId: "1:700305194097:web:23a0461e47cc97a09e6fd0",
  measurementId: "G-N6NB4EVQCX"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function login(){
  var p=document.getElementById('pin').value;
  if(p==="Clinton123"){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    loadUsers();
    loadServers();
  } else { alert('Wrong Founder Password'); }
}
async function loadServers(){
  try{
    let snap = await db.collection("servers").get();
    let html="";
    snap.forEach(doc=>{
      let s = doc.data();
      html += "<tr><td>"+(s.name||"")+"</td><td>"+(s.country||"")+" "+(s.flag||"")+"</td><td>"+(s.config||"")+"</td></tr>";
    });
    if(!html) html="<tr><td colspan='3'>No servers yet - Add for Firebase</td></tr>";
    document.getElementById('serverList').innerHTML=html;
  }catch(e){ document.getElementById('serverList').innerHTML="<tr><td colspan='3'>Error: "+e.message+" - Check Firestore Rules</td></tr>"; }
}
function loadUsers(){
  db.collection("users").get().then(snap=>{
    document.getElementById('total').innerText = snap.size;
    let html="";
    snap.forEach(doc=>{
      let u = doc.data();
      html += "<tr><td>"+(u.email||"")+"</td><td>"+(u.country||"")+"</td><td><button style='padding:5px;background:red;color:white;border:none;border-radius:5px' onclick=\"removeUser('"+doc.id+"')\">Block</button></td></tr>";
    });
    if(!html) html="<tr><td colspan='3'>No users yet - share your app link</td></tr>";
    document.getElementById('list').innerHTML=html;
  }).catch(e=>{ document.getElementById('list').innerHTML="<tr><td colspan='3'>Error: "+e.message+"</td></tr>"; });
}
function removeUser(id){
  db.collection("users").doc(id).delete().then(()=>loadUsers());
}
</script>
</body>
</html>
