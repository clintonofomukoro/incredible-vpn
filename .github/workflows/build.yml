
name: Build INCREDIBLE VPN

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          mkdir project
          unzip -q INCREDIBLE-VPN-Android-Starter.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Build demo APK
        run: |
          sed -i '/id("com.google.gms.google-services")/d' project/app/build.gradle.kts
          gradle -p project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: incredible-vpn-demo-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
